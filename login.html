<!DOCTYPE html lang="en">
<html>
    <head>
        <title>Login</title>
        <meta charset="utf-8">
    </head>
    <body>
        <form action="#">
            <table>
                <thead>
                    <tr>
                        <th colspan="2">Login Form</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><label for="login-username">Email:</label></td>
                        <td><input type="text" name="login-username"></td>
                    </tr>
                    <tr>
                        <td><label for="login-password">Password:</label></td>
                        <td><input type="text" name="login-password"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><button type="submit" >Submit</button></td>
                    </tr>
                </tbody>
            </table>
        </form>
        <script src="auth.js"></script>
    </body>
</html>
